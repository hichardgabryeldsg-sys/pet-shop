<h1>Produtos</h1>

<div class="produtos">

  @for (produto of produtos; track produto.id) {

    <div class="produto">

      <img
        [src]="produto.imagem"
        [alt]="produto.nome"
      >

      <h2>{{ produto.nome }}</h2>

      <p>
        R$ {{ produto.preco.toFixed(2) }}
      </p>

      <button
        (click)="adicionarAoCarrinho(produto)"
      >
        🛒 Adicionar ao carrinho
      </button>

    </div>

  }

</div>
